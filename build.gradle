plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.midori.hyperccfit'
    compileSdk 34

    defaultConfig {
        applicationId "com.midori.hyperccfit"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            resources.srcDirs = ['.']
            resources.includes = ['META-INF/xposed/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
